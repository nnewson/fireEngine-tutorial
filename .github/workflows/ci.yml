name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Keep this tool checkout identical to the manifest baseline in
# vcpkg-configuration.json. Pinning both makes port resolution and the vcpkg
# executable interpreting it reproducible.
env:
  VCPKG_COMMIT: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4

jobs:
  # -------- Platform-independent lint gates (run once) --------

  dependency-pin:
    name: vcpkg pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check registry and tool revisions match
        run: |
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg-configuration.json"))["default-registry"]["baseline"])')"
          if [[ "${baseline}" != "${VCPKG_COMMIT}" ]]; then
            echo "vcpkg baseline ${baseline} does not match CI tool ${VCPKG_COMMIT}." >&2
            exit 1
          fi

  terminology:
    name: US English terminology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for UK English spellings
        run: |
          # grep exits 0 when it matches, 1 when it does not, and above 1 on
          # error. Capturing the status keeps a missing path or unreadable file
          # from being reported as a clean tree.
          status=0
          grep -rInE --color=never \
            '(colour|behaviour|catalogue|initialis|normalis|rasteris|synchronis|optimis|organis|recognis|analys|serialis|artefact|centre|licence|grey)' \
            include src shaders tests README.md CMakeLists.txt || status=$?
          case "$status" in
            0) echo 'Use US English spelling in first-party code and comments.' >&2; exit 1 ;;
            1) ;;
            *) echo "grep failed with exit $status" >&2; exit "$status" ;;
          esac

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-22
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-22
      - name: Check formatting
        run: |
          find src include tests -type f \( \
            -name '*.hpp' -o -name '*.cpp' -o -name '*.h' -o -name '*.cxx' \
          \) -print0 | xargs -0 clang-format-22 --dry-run -Werror

  clang-tidy:
    name: clang-tidy
    needs: dependency-pin
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget lsb-release software-properties-common
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository \
            "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main"
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake clang-tidy-22 g++-14 \
            autoconf autoconf-archive automake libtool \
            libxinerama-dev libxcursor-dev libxcb1-dev libx11-xcb-dev \
            xorg-dev libglu1-mesa-dev pkg-config

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          ref: ${{ env.VCPKG_COMMIT }}

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure
        run: cmake --preset vcpkg -DFIRE_ENGINE_TUTORIAL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset default

      - name: clang-tidy
        # Catch2's generated macros need a test-specific configuration. Keep the
        # production checks strict until that configuration is introduced.
        run: find src -name '*.cpp' -print0 | xargs -0 clang-tidy-22 -p build

  documentation:
    name: documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Build documentation
        run: |
          cmake -E make_directory build/docs
          cmake -E make_directory build/docs-internal
          doxygen docs/Doxyfile
          doxygen docs/Doxyfile.internal
          cmake -E copy_directory \
            build/docs-internal/html \
            build/docs/html/internals

      - name: Check documentation boundary
        run: |
          public_file_index=build/docs/html/files.html
          internal_file_index=build/docs-internal/html/files.html

          if grep -qE '>(detail|src)</a>' "$public_file_index"; then
            echo 'Internal headers or sources leaked into the public documentation.' >&2
            exit 1
          fi

          grep -q '>detail</a>' "$internal_file_index" || {
            echo 'The internal documentation does not contain detail headers.' >&2
            exit 1
          }
          grep -q '>src</a>' "$internal_file_index" || {
            echo 'The internal documentation does not contain implementation sources.' >&2
            exit 1
          }

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/docs/html
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.PUBLISH_DOXYGEN == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.PUBLISH_DOXYGEN == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs/html

  deploy-documentation:
    name: deploy documentation
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PUBLISH_DOXYGEN == 'true'
    needs: documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------- Per-platform build + test --------

  build-test-linux:
    name: build and test (Linux)
    needs: dependency-pin
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake g++-14 libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb \
            autoconf autoconf-archive automake libtool \
            libxinerama-dev libxcursor-dev libxcb1-dev libx11-xcb-dev \
            xorg-dev libglu1-mesa-dev pkg-config

      - name: Select Lavapipe Vulkan driver
        run: |
          # Mesa's manifest name has changed between package versions. Discover
          # the installed Lavapipe ICD instead of depending on a particular name.
          lavapipe_manifest="$(find /usr/share/vulkan/icd.d \
            -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"

          if [[ -z "${lavapipe_manifest}" ]]; then
            echo "The mesa-vulkan-drivers package did not install a Lavapipe ICD." >&2
            exit 1
          fi

          echo "Using Lavapipe ICD: ${lavapipe_manifest}"
          echo "VK_DRIVER_FILES=${lavapipe_manifest}" >> "${GITHUB_ENV}"

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          ref: ${{ env.VCPKG_COMMIT }}

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure
        run: cmake --preset vcpkg -DFIRE_ENGINE_TUTORIAL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset default

      - name: Inspect Vulkan runtime
        run: xvfb-run --auto-servernum vulkaninfo --summary

      - name: Test
        run: xvfb-run --auto-servernum ctest --preset default

      # Validation is useful for correctness but would distort the host-call
      # ratios this observation exists to expose. Reuse the installed vcpkg
      # tree in a separate Release build and publish values without thresholds.
      - name: Configure Release benchmark
        run: >-
          cmake --preset vcpkg -B build-benchmark
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=OFF
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build/vcpkg_installed

      - name: Build Release benchmark
        run: cmake --build build-benchmark --target fireEngineTutorial

      - name: Record Lavapipe one-draw worker-reset estimate
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          xvfb-run --auto-servernum ./build-benchmark/fireEngineTutorial
          --benchmark 1 --recording-threads 1

      # Run one worker, two workers, then one worker again at each workload from
      # this single binary. The outer arms force one participant so the
      # comparison survives any change to the automatic split threshold, which
      # would otherwise silently make the 10,000-draw controls two-worker. T1
      # and the phase inputs come from the mean of the two outer arms, T2 from
      # the centre arm, and the registered drift rule classifies the difference
      # before the materialization gate.
      - name: Record Lavapipe 1,000-draw one-worker control A
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          xvfb-run --auto-servernum ./build-benchmark/fireEngineTutorial
          --benchmark 1000 --recording-threads 1

      - name: Record Lavapipe 1,000-draw two-worker candidate
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          xvfb-run --auto-servernum ./build-benchmark/fireEngineTutorial
          --benchmark 1000 --recording-threads 2

      - name: Record Lavapipe 1,000-draw one-worker control B
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          xvfb-run --auto-servernum ./build-benchmark/fireEngineTutorial
          --benchmark 1000 --recording-threads 1

      - name: Record Lavapipe 10,000-draw one-worker control A
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          xvfb-run --auto-servernum ./build-benchmark/fireEngineTutorial
          --benchmark 10000 --recording-threads 1

      - name: Record Lavapipe 10,000-draw two-worker candidate
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          xvfb-run --auto-servernum ./build-benchmark/fireEngineTutorial
          --benchmark 10000 --recording-threads 2

      - name: Record Lavapipe 10,000-draw one-worker control B
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          xvfb-run --auto-servernum ./build-benchmark/fireEngineTutorial
          --benchmark 10000 --recording-threads 1

      - name: Record Lavapipe 1,000-draw direct-primary control
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          xvfb-run --auto-servernum ./build-benchmark/fireEngineTutorial
          --benchmark 1000 --direct-primary

      - name: Record Lavapipe 10,000-draw direct-primary control
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          xvfb-run --auto-servernum ./build-benchmark/fireEngineTutorial
          --benchmark 10000 --direct-primary

  # KosmicKrisp requires Apple Silicon, macOS 26, and an SDK installation that
  # includes the preview driver. Hosted CI therefore runs the device-free suite
  # without claiming Vulkan-device coverage.
  build-macos:
    name: build and test (macOS)
    needs: dependency-pin
    runs-on: macos-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: brew install ninja

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          ref: ${{ env.VCPKG_COMMIT }}

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure
        run: cmake --preset vcpkg -DFIRE_ENGINE_TUTORIAL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset default

      - name: Test device-free suite
        run: ctest --preset default -L device-free --no-tests=error

  # GitHub's hosted Windows runner has no Vulkan ICD. This job therefore
  # runs the device-free suite without claiming Vulkan-device coverage.
  build-windows:
    name: build and test (Windows)
    needs: dependency-pin
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Enable the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ninja
        run: choco install ninja --yes --no-progress

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          ref: ${{ env.VCPKG_COMMIT }}

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure
        run: cmake --preset vcpkg -DFIRE_ENGINE_TUTORIAL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset default

      - name: Test device-free suite
        run: ctest --preset default -L device-free --no-tests=error
